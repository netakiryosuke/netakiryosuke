name: Update UUID Profile

on:
  schedule:
    # 24時間ごとに実行
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run update script
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python .github/scripts/update_uuids.py

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uuids.txt README.md
          # 変更がなければ何もしない
          git diff --cached --quiet && echo "No changes" && exit 0
          TOTAL=$(wc -l < uuids.txt)
          git commit -m "Update UUIDs to ${TOTAL} ($(date -u +%Y-%m-%d))"
          git push
