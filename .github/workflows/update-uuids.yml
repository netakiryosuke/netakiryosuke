name: Update UUID Profile

on:
  schedule:
    # 24時間ごとに実行
    - cron: '0 */24 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4 playwright

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Run update script
        run: python .github/scripts/update_uuids.py

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uuids.txt README.md
          git diff --cached --quiet && echo "No changes" && exit 0
          TOTAL=$(wc -l < uuids.txt)
          git commit -m "Update UUIDs to ${TOTAL} ($(TZ='Asia/Tokyo' date +%Y-%m-%d))"
          git push
